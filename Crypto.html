<!DOCTYPE html>
<html lang="de">

<head>
<meta charset="UTF-8">

<title>Krypto</title>

<style>

:root{

 --background:#0f172a;
 --surface:#111e35;
 --surface-light:#17263f;

 --accent:#38bdf8;
 --accent-hover:#7dd3fc;

 --text:#e5e7eb;
 --muted:#94a3b8;

 --border:rgba(148,163,184,.15);

}

*{

 box-sizing:border-box;

}

body{

 font-family:"Segoe UI",sans-serif;

 max-width:900px;

 margin:0 auto;

 padding:40px 20px;

 min-height:100vh;

 background:#0f172a;

 background-image:
 radial-gradient(
 ellipse at 50% 0%,
 rgba(14,165,233,.09),
 transparent 55%
 );

 color:var(--text);

}

h2{

 text-align:center;

 color:var(--accent);

 font-size:3rem;

 margin-bottom:25px;

}

.card{

 background:var(--surface);

 border:1px solid var(--border);

 border-radius:16px;

 padding:25px;

}

label{

 display:block;

 margin-top:15px;

 color:var(--muted);

 font-weight:600;

}

textarea,
input{

 width:100%;

 padding:12px;

 margin:8px 0;

 font-family:monospace;

 background:var(--surface-light);

 border:1px solid var(--border);

 border-radius:10px;

 color:var(--text);

 outline:none;

 transition:.2s ease;

}

textarea:focus,
input:focus{

 border-color:
 rgba(56,189,248,.4);

 box-shadow:
 0 0 10px
 rgba(56,189,248,.15);

}

button{

 padding:12px 20px;

 margin-right:10px;

 background:#0ea5e9;

 border:none;

 border-radius:10px;

 color:#082f49;

 cursor:pointer;

 font-size:15px;

 font-weight:700;

 transition:.2s ease;

}

button:hover{

 background:var(--accent-hover);

 box-shadow:
 0 0 12px
 rgba(56,189,248,.25);

}

.bottom-actions{

 display:flex;

 justify-content:center;

 gap:10px;

 flex-wrap:wrap;

 margin-top:25px;

}

.back-btn{

 display:inline-block;

 background:#0ea5e9;

 color:#082f49;

 text-decoration:none;

 padding:12px 20px;

 border-radius:10px;

 font-weight:700;

 transition:.2s ease;

}

.back-btn:hover{

 background:var(--accent-hover);

 transform:translateY(-1px);

}

footer{

 margin-top:60px;

 text-align:center;

 color:#64748b;

}

</style>

</head>

<body>

<h2>Krypto</h2>

<div class="card">

<label>

Passwort (wird nicht gespeichert):

</label>

<input
id="pw"
type="password"
placeholder="Passwort eingeben…">

<label>

Eingabe (Klartext oder Cipher):

</label>

<textarea
id="input"
rows="4"></textarea>

<button onclick="encrypt()">

Verschlüsseln

</button>

<button onclick="decrypt()">

Entschlüsseln

</button>

<label>

Ausgabe:

</label>

<textarea
id="output"
rows="4"
readonly></textarea>

</div>

<div class="bottom-actions">

<a
href="https://mrdatenschutz.github.io/Nexora/index.html"
class="back-btn">

Zur Startseite

</a>

</div>

<footer>

© Nexora – Krypto

</footer>

<script>

// Text <-> Bytes

const enc = new TextEncoder();

const dec = new TextDecoder();

// Base64 Hilfsfunktionen

function toBase64(buf) {

 return btoa(String.fromCharCode(...new Uint8Array(buf)));

}

function fromBase64(b64) {

 return Uint8Array.from(atob(b64), c => c.charCodeAt(0));

}

// Key aus Passwort ableiten (PBKDF2)

async function deriveKey(password) {

 const salt = enc.encode("konstante_salt_fuer_determinismus");

 const baseKey = await crypto.subtle.importKey(

 "raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]

 );

 return crypto.subtle.deriveKey(

 { name: "PBKDF2", salt, iterations: 200000, hash: "SHA-256" },

 baseKey,

 { name: "AES-GCM", length: 256 },

 false,

 ["encrypt", "decrypt"]

 );

}

// Verschlüsseln

async function encrypt() {

 const pw = document.getElementById("pw").value;

 if (!pw) return alert("Bitte Passwort eingeben!");

 const key = await deriveKey(pw);

 const iv = crypto.getRandomValues(new Uint8Array(12));

 const data = enc.encode(document.getElementById("input").value);

 const cipher = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, data);

 const combined = new Uint8Array(iv.length + cipher.byteLength);

 combined.set(iv, 0);

 combined.set(new Uint8Array(cipher), iv.length);

 document.getElementById("output").value = toBase64(combined);

}

// Entschlüsseln

async function decrypt() {

 const pw = document.getElementById("pw").value;

 if (!pw) return alert("Bitte Passwort eingeben!");

 const key = await deriveKey(pw);

 const raw = fromBase64(document.getElementById("input").value);

 const iv = raw.slice(0, 12);

 const cipher = raw.slice(12);

 try {

 const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, cipher);

 document.getElementById("output").value = dec.decode(plain);

 } catch (e) {

 document.getElementById("output").value =
 "Entschlüsselung fehlgeschlagen (falsches Passwort?)";

 }

}

</script>

</body>
</html>
